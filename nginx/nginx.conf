events {}

http {
  server {
    listen 80;
    server_name localhost;

    # upstream my_service {
    #   5000 → 60% , 5001 → 20% , 5003 → 20%
    #   server host.docker.internal:5000 weight=3;
    #   server host.docker.internal:5001 weight=1;
    #   server host.docker.internal:5003 weight=1;
    # }

    upstream my_service {
      # least_conn;  // Send the next request to the server with the fewest active connections
      # ip_hash;  // Requests from the same client IP tend to go to the same backend.

      server host.docker.internal:5000;
      server host.docker.internal:5001;
      server host.docker.internal:5003;
    }

    location / {
      proxy_pass http://my_service;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /api {
      proxy_pass http://host.docker.internal:3000;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /api/v1 {
      proxy_pass http://host.docker.internal:3001;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}



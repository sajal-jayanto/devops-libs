events {}

http {

  # Rate limiting config enable 
  # zone=<name>:<size>  -> shared memory zone to track request state (1m ~= 16k IPs)
  # rate=<n>r/s          -> allowed sustained request rate per key ($binary_remote_addr = client IP)
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

  server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    upstream my_service {

      # Default = Round Robin
      # least_conn;  // Send the next request to the server with the fewest active connections
      # ip_hash;  // Requests from the same client IP tend to go to the same backend.
      
      # Weighted Round Robin: 5000 → 60% , 5001 → 20% , 5003 → 20%
      # server host.docker.internal:5000 weight=3;
      # server host.docker.internal:5001 weight=1;
      # server host.docker.internal:5003 weight=1;

      server host.docker.internal:5000;
      server host.docker.internal:5001;
      server host.docker.internal:5003;
    }

    location / {
      proxy_pass http://my_service;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /api {
      # Rate limiting add for this path 
      # burst=<n>    -> allow short bursts of n requests queued above the rate
      # nodelay      -> serve burst requests immediately instead of throttling them
      limit_req zone=api_limit burst=10 nodelay;
      limit_req_status 429;

      proxy_pass http://host.docker.internal:3000;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /api/v1 {
      proxy_pass http://host.docker.internal:3001;

      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 404 
    error_page 404 /404.html;
    location = /404.html {
      root /usr/share/nginx/html;
      internal;
    }

    # 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
      internal;
    }
  }
}


